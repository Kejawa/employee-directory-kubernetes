apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employee-backend
  namespace: production

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employee-backend

  minReplicas: 3
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70