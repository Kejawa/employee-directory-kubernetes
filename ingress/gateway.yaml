apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: 
  name: employee-gateway
  namespace: production
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same  
    - name: https
      protocol: HTTPS
      port: 443
      hostname: web1.local.lab
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: web1-tls
      allowedRoutes:
        namespaces:
          from: Same